seed: 42

# dataset
corpus_path: "dataset/training/corpus.csv" # columns: docno,title,text
text_column: "text"
eval_fraction: 0.0

# model
base_model: "jhu-clsp/mmBERT-base" # or path to mmBERT checkpoint
block_size: 512 # sequence length for MLM packing

# lora
use_lora: False
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.05
lora_modules:
  - Wqkv
  - Wi
  - Wo

# training
output_dir: "models/mmbert-amsunda"
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 8
num_train_epochs: 50
max_steps: -1
learning_rate: 3e-4
warmup_ratio: 0.06
weight_decay: 1e-5
mlm_probability: 0.25
optim: adamw_torch_fused
num_proc: 8

bf16: false
fp16: true
gradient_checkpointing: true

# checkpoint
logging_strategy: "epoch"
logging_steps: 1
save_strategy: "epoch"
save_steps: 1
eval_strategy: "no"
eval_steps: 400
save_total_limit: 1
load_best_model_at_end: false
