seed: 42

# dataset
data_path: "dataset/training/train.triples.csv" # columns: query,positive,negative

# model
base_model: "models/mmbert-amsunda/final" # dapt checkpoint

# training
output_dir: "models/mmbert-amsunda-crossencoder"
per_device_train_batch_size: 32
gradient_accumulation_steps: 1
num_train_epochs: 10
max_steps: -1
learning_rate: 3e-4
warmup_ratio: 0.06
weight_decay: 1e-5
optim: adamw_torch_fused

bf16: false
fp16: true
gradient_checkpointing: true

# checkpoint
logging_strategy: "epoch"
logging_steps: 1
save_strategy: "epoch"
save_steps: 1
save_total_limit: 1
load_best_model_at_end: false
