[project]
name = "amsunda-bench"
version = "0.1.0"
description = "Benchmarking AMSunda"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.11.0",
    "altair>=5.5.0",
    "datasets>=4.4.1",
    "faiss-cpu>=1.12.0",
    "peft>=0.17.1",
    "polars>=1.34.0",
    "pyterrier-dr>=0.6.2",
    "python-terrier>=0.13.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.1.2",
    "torch>=2.9.0",
    "transformers>=4.57.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "vegafusion>=2.0.3",
    "vl-convert-python>=1.8.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
